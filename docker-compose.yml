services:
  backend:
    build:
      context: ./backend
      dockerfile: backend/Dockerfile
    container_name: registro_consultas_backend
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Configuración de conexión a SQL Server
      - ConnectionStrings__Registro=${REGISTRO_SQL_CONNECTION:?Define REGISTRO_SQL_CONNECTION en el entorno}
      - Frontend__Origin=http://localhost:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: registro_consultas_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    restart: unless-stopped
